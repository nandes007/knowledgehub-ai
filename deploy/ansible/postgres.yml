---
# PostgreSQL on the app server, replacing Supabase.
#
#   ansible-playbook -i inventory.yml postgres.yml --ask-vault-pass
#
# Needs `postgres_password` in vault.yml (see vault.yml.example).
# Idempotent: re-running only reapplies config, and rotates the app password
# if you changed it in the vault.
#
# It listens on loopback, plus this host's own address for the servers listed in
# `pg_client_hosts` - ufw drops 5432 from anywhere else. From your laptop, use an
# SSH tunnel; see the summary the playbook prints at the end.

- name: Install and configure PostgreSQL
  hosts: knowledgehub
  remote_user: "{{ deploy_user }}"
  become: true
  vars_files:
    - vault.yml

  tasks:
    # Alphanumeric only: the password goes into a URL-shaped DATABASE_URL, and
    # a stray `@`, `/` or `:` there fails in a way that looks like a network
    # problem rather than a quoting one.
    - name: Require a database password
      ansible.builtin.assert:
        that: postgres_password | default('') is match('^[A-Za-z0-9]{16,}$')
        fail_msg: >-
          Set postgres_password in vault.yml to 16+ alphanumeric characters:
          openssl rand -hex 24

    - name: Install PostgreSQL
      ansible.builtin.apt:
        name:
          - postgresql
          # community.postgresql modules run on the server and need a driver.
          - python3-psycopg2
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Debian's postgresql.conf ends with `include_dir = 'conf.d'`, so a drop-in
    # survives package upgrades in a way that editing postgresql.conf does not.
    - name: Check the cluster matches pg_version
      ansible.builtin.stat:
        path: "{{ pg_conf_dir }}"
      register: pg_conf
      failed_when: not pg_conf.stat.isdir | default(false)

    - name: Get this host's Tailscale IP
      when: tailscale_enabled | default(false)
      ansible.builtin.command: tailscale ip -4
      register: tailscale_ip_result
      changed_when: false

    - name: Set Tailscale IP fact
      when: tailscale_enabled | default(false)
      ansible.builtin.set_fact:
        tailscale_ip: "{{ tailscale_ip_result.stdout }}"

    - name: Tune and harden the cluster
      notify: Restart postgresql
      ansible.builtin.template:
        src: postgresql-tuning.conf.j2
        dest: "{{ pg_conf_dir }}/10-knowledgehub.conf"
        owner: postgres
        group: postgres
        mode: "0640"

    # ponytail: the Debian default pg_hba.conf is kept as-is - `peer` on the
    # local socket and `scram-sha-256` over 127.0.0.1/::1 is exactly what the
    # host-networked app container needs. Entries for other servers are added
    # further down, from pg_client_hosts.

    - name: Start PostgreSQL at boot
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true

    - name: Apply pending config now
      ansible.builtin.meta: flush_handlers

    - name: Create the application role
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ db_user }}"
        password: "{{ postgres_password }}"
        # Least privilege: it owns its own database and nothing else.
        role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE
      no_log: true

    - name: Drop existing database if reset_db is true
      when: reset_db | default(false) | bool
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        state: absent

    - name: Create the database
      become_user: postgres
      community.postgresql.postgresql_db:
        name: "{{ db_name }}"
        owner: "{{ db_user }}"
        encoding: UTF8

    - name: Keep other roles out of the database
      become_user: postgres
      community.postgresql.postgresql_privs:
        login_db: "{{ db_name }}"
        type: database
        role: PUBLIC
        privs: CONNECT
        state: absent

    - name: Let the app role connect
      become_user: postgres
      community.postgresql.postgresql_privs:
        login_db: "{{ db_name }}"
        type: database
        role: "{{ db_user }}"
        privs: CONNECT,TEMP

    - name: Grant public schema privileges to app role
      become_user: postgres
      community.postgresql.postgresql_privs:
        login_db: "{{ db_name }}"
        type: schema
        objs: public
        role: "{{ db_user }}"
        privs: ALL

    # Databases for other projects on this server. They share db_user rather
    # than getting a role each: one credential to rotate, at the cost of that
    # credential opening every database on the box.
    - name: Create the other databases
      become_user: postgres
      loop: "{{ pg_extra_databases | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      community.postgresql.postgresql_db:
        name: "{{ item.name }}"
        owner: "{{ db_user }}"
        encoding: UTF8

    # Frameworks that target a named schema (Hibernate's default_schema,
    # Liquibase's defaultSchemaName) expect it to exist already - they create
    # tables in it, never the schema itself.
    - name: Create their schemas
      become_user: postgres
      loop: "{{ pg_extra_databases | default([]) | selectattr('schema', 'defined') }}"
      loop_control:
        label: "{{ item.name }}.{{ item.schema }}"
      community.postgresql.postgresql_schema:
        login_db: "{{ item.name }}"
        name: "{{ item.schema }}"
        owner: "{{ db_user }}"

    # Every role can CONNECT to every database by default, so this matters as
    # soon as a second role exists - a read-only reporting login, say.
    - name: Keep the other databases off limits to everyone else
      become_user: postgres
      loop: "{{ pg_extra_databases | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      community.postgresql.postgresql_privs:
        login_db: "{{ item.name }}"
        type: database
        role: PUBLIC
        privs: CONNECT
        state: absent

    - name: Let the maintenance role connect to them
      become_user: postgres
      loop: "{{ pg_extra_databases | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      community.postgresql.postgresql_privs:
        login_db: "{{ item.name }}"
        type: database
        role: "{{ db_user }}"
        privs: CONNECT,TEMP

    - name: Install the backup script
      ansible.builtin.copy:
        dest: /usr/local/bin/pg-backup
        mode: "0755"
        content: |
          #!/bin/sh
          # Managed by Ansible - deploy/ansible/postgres.yml
          set -eu
          dir=/var/backups/postgresql
          day=$(date +%F)

          # Every real database, asked for at run time - so a database added
          # later is backed up without anyone remembering to edit this script.
          # Assigned rather than piped into the loop: `set -e` then aborts if
          # psql itself fails, instead of quietly iterating over nothing.
          dbs=$(psql -Atqc "SELECT datname FROM pg_database
                            WHERE NOT datistemplate AND datallowconn
                              AND datname <> 'postgres'")

          for db in $dbs; do
            # Write to .tmp and rename: a dump interrupted half way through then
            # leaves no file at all, rather than a truncated one that looks valid.
            # -Fc: compressed custom format, restore with pg_restore.
            pg_dump -Fc "$db" > "$dir/$db-$day.dump.tmp"
            mv "$dir/$db-$day.dump.tmp" "$dir/$db-$day.dump"
          done

          find "$dir" -name '*.dump' -mtime +{{ pg_backup_keep_days }} -delete

    - name: Create the backup directory
      ansible.builtin.file:
        path: /var/backups/postgresql
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    # A systemd timer rather than cron: same effort, and `systemctl status
    # pg-backup` tells you whether last night's dump actually worked.
    - name: Install the backup unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/pg-backup.service
        mode: "0644"
        content: |
          [Unit]
          Description=Dump the {{ db_name }} database
          After=postgresql.service

          [Service]
          Type=oneshot
          User=postgres
          ExecStart=/usr/local/bin/pg-backup

    - name: Install the backup timer
      ansible.builtin.copy:
        dest: /etc/systemd/system/pg-backup.timer
        mode: "0644"
        content: |
          [Unit]
          Description=Daily {{ db_name }} backup

          [Timer]
          OnCalendar=daily
          # The host may be asleep or rebooting at 00:00; run on next boot instead
          # of skipping the day.
          Persistent=true
          RandomizedDelaySec=30m

          [Install]
          WantedBy=timers.target

    - name: Enable the backup timer
      ansible.builtin.systemd_service:
        name: pg-backup.timer
        daemon_reload: true
        enabled: true
        state: started

    - name: Take a first backup so the restore path is proven, not assumed
      ansible.builtin.command: systemctl start --wait pg-backup.service
      changed_when: true

    # One dump per database, dated today - so the check still catches it if the
    # loop over databases breaks and only the first one gets dumped.
    - name: Check today's dumps landed, one per database
      ansible.builtin.find:
        paths: /var/backups/postgresql
        patterns: "*-{{ ansible_date_time.date }}.dump"
      register: dumps
      failed_when: dumps.matched < 1 + (pg_extra_databases | default([]) | length)

    # Proves the exact DSN the app will use, password and TCP path included -
    # not just that the server is up on its local socket.
    - name: Connect the way the application will
      community.postgresql.postgresql_query:
        login_host: 127.0.0.1
        login_user: "{{ db_user }}"
        login_password: "{{ postgres_password }}"
        login_db: "{{ db_name }}"
        query: SELECT current_user, current_database()
      no_log: true

    # --- Access from other servers ------------------------------------------
    # Both servers sit in the same IPv6 /64, so they reach each other directly -
    # no tunnel, no VPN. Postgres stays shut to everyone else: it binds only
    # loopback plus this host's own address, ufw opens 5432 to the listed
    # addresses alone, and pg_hba demands TLS from them.
    - name: Allow the client servers in, over TLS only
      become_user: postgres
      notify: Reload postgresql
      loop: "{{ pg_client_hosts | default([]) }}"
      community.postgresql.postgresql_pg_hba:
        dest: /etc/postgresql/{{ pg_version }}/main/pg_hba.conf
        # hostssl, not host: an unencrypted connection is refused outright
        # rather than quietly accepted when the client forgets sslmode.
        contype: hostssl
        databases: all
        users: "{{ db_user }}"
        address: "{{ item }}"
        method: scram-sha-256

    - name: Open 5432 to those servers and no one else
      loop: "{{ pg_client_hosts | default([]) }}"
      community.general.ufw:
        rule: allow
        from_ip: "{{ item }}"
        to_port: "5432"
        proto: tcp

    - name: Allow the tailnet in
      when: tailscale_enabled | default(false)
      become_user: postgres
      notify: Reload postgresql
      community.postgresql.postgresql_pg_hba:
        dest: /etc/postgresql/{{ pg_version }}/main/pg_hba.conf
        # host, not hostssl: Tailscale's WireGuard tunnel already encrypts
        # this traffic, so demanding Postgres-level TLS on top is redundant.
        contype: host
        databases: all
        users: "{{ db_user }}"
        address: 100.64.0.0/10
        method: scram-sha-256

    - name: Open 5432 to the tailnet only
      when: tailscale_enabled | default(false)
      community.general.ufw:
        rule: allow
        interface: tailscale0
        direction: in
        to_port: "5432"
        proto: tcp

    - name: How to use it
      ansible.builtin.debug:
        msg: |
          PostgreSQL is up.

          host      127.0.0.1   port 5432
          database  {{ db_name }}
          user      {{ db_user }}
          password  (postgres_password in deploy/ansible/vault.yml)
          schema    {{ db_schema }}

          From your laptop:
            ssh -L 5432:127.0.0.1:5432 {{ deploy_user }}@{{ ansible_host }}
            psql "postgresql://{{ db_user }}@127.0.0.1:5432/{{ db_name }}"

          On the server:
            sudo -u postgres psql {{ db_name }}

          Point the app at it: set `use_local_postgres: true` in inventory.yml,
          then re-run site.yml.
          {% if tailscale_enabled | default(false) %}

          Also reachable from any device on your tailnet, no SSH tunnel needed:
            psql "postgresql://{{ db_user }}@{{ inventory_hostname }}:5432/{{ db_name }}"
          DataGrip: host {{ inventory_hostname }} (or {{ tailscale_ip }}), port 5432, no SSH tab.
          {% endif %}
          {% for extra in pg_extra_databases | default([]) %}
          {% if loop.first %}

          Other databases here, same user and password:
          {% endif %}
            {{ extra.name }}{{ ' (schema ' ~ extra.schema ~ ')' if extra.schema is defined else '' }}
          {% endfor %}
          {% for client in pg_client_hosts | default([]) %}
          {% if loop.first %}

          Reachable from these servers, TLS required:
          {% endif %}
            {{ client }}
              jdbc:postgresql://[{{ ansible_host }}]:5432/DATABASE?sslmode=require
              psql "postgresql://{{ db_user }}@[{{ ansible_host }}]:5432/DATABASE?sslmode=require"
          {% endfor %}

          Backups: /var/backups/postgresql, daily, all databases, {{ pg_backup_keep_days }} days kept.
            systemctl list-timers pg-backup.timer
            sudo -u postgres pg_restore -d {{ db_name }} --clean <dump>

  handlers:
    - name: Restart postgresql
      ansible.builtin.service:
        name: postgresql
        state: restarted

    # pg_hba is re-read on reload; a restart would drop live connections for
    # nothing.
    - name: Reload postgresql
      ansible.builtin.service:
        name: postgresql
        state: reloaded
