all:
  hosts:
    knowledgehub:
      # Server public IPv6. Your laptop needs IPv6 (or Cloudflare WARP) to reach it.
      ansible_host: "2407:6ac0:3:9d:abcd::1bb"
  vars:
    domain: knowledgehubai.nandes.tech
    deploy_user: nandes
    app_dir: /home/nandes/knowledgehub-ai
    ssh_pubkey_file: ~/.ssh/id_ed25519.pub

    # IPv6-only host: Docker Hub is IPv4-only, so image pulls need DNS64/NAT64.
    # Set false only if the server turns out to have working IPv4 egress.
    dns64_enabled: true

    # --- Self-hosted PostgreSQL (postgres.yml) ---
    db_name: knowledgehub
    # One role for every database on this server, not one per project - see
    # pg_extra_databases below.
    db_user: nandestech
    # app/db.py sets search_path to this schema on every connection.
    db_schema: knowledgehub
    # Ubuntu 24.04 ships PostgreSQL 16. Bump after a major-version upgrade -
    # postgres.yml fails loudly if the cluster directory does not exist.
    pg_version: "16"
    pg_conf_dir: /etc/postgresql/{{ pg_version }}/main/conf.d
    pg_backup_keep_days: 7

    # Databases for other projects. They are owned by db_user above and share
    # its password - one login to maintain, at the cost of that login opening
    # every database. `schema` is optional; omit it and the project's tables go
    # in `public`, which the owning role can already write to.
    pg_extra_databases:
      # Java/Spring app on ...::1c4. Hibernate's default_schema and Liquibase
      # both expect this schema to exist before the app starts.
      - name: meeting_room_booking
        schema: meeting_room_booking

    # Servers allowed to connect over the network, one /128 each. Everything
    # else is dropped by ufw; these still need TLS and the scram password.
    pg_client_hosts:
      - 2407:6ac0:3:9d:abcd::1c4/128    # meeting-room-booking

    # The app talks to the local PostgreSQL from postgres.yml. Set back to false
    # and re-run site.yml to fall back to Supabase.
    use_local_postgres: true

    # --- Tailscale (tailscale.yml) ---
    # Set true after running tailscale.yml, then re-run postgres.yml to open
    # 5432 to the tailnet (100.64.0.0/10) - no public IPv6, no SSH tunnel.
    tailscale_enabled: true
