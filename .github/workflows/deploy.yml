name: Deploy

on:
  push:
    branches: [main]

env:
  DOMAIN: knowledgehubai.nandes.tech
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/knowledgehub-ai-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/knowledgehub-ai-frontend

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: backend
        run: uv sync --extra dev
      - working-directory: backend
        run: uv run pytest

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://knowledgehubai.nandes.tech

  build-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://knowledgehubai.nandes.tech
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -Lo cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH over Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host deploy-server
            HostName ${{ secrets.SSH_HOST }}
            User deploy
            IdentityFile ~/.ssh/deploy_key
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
          EOF

      - name: Ship compose files
        run: |
          scp docker-compose.prod.yml Caddyfile deploy-server:~/knowledgehub-ai/

      - name: Pull and restart
        run: |
          ssh deploy-server "cd ~/knowledgehub-ai && IMAGE_TAG=${{ github.sha }} DOMAIN=${{ env.DOMAIN }} podman-compose -f docker-compose.prod.yml pull && IMAGE_TAG=${{ github.sha }} DOMAIN=${{ env.DOMAIN }} podman-compose -f docker-compose.prod.yml up -d"

      - name: Wait for health check
        run: |
          ssh deploy-server '
            for i in $(seq 1 10); do
              curl -sf https://${{ env.DOMAIN }}/healthz && exit 0
              sleep 3
            done
            echo "healthz did not come up in time" >&2
            exit 1
          '
