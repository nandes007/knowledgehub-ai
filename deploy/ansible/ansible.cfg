[defaults]
inventory = inventory.yml
# The image build is silent for 5-15 minutes. Over an IPv6/WARP tunnel an idle
# connection gets reaped, which surfaces as "Shared connection ... closed".
interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60m -o ServerAliveInterval=30 -o ServerAliveCountMax=120
retries = 3
pipelining = true
